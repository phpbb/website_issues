name: Feature request
description: Suggest an idea or improvement for the phpBB.com websites
labels: [enhancement]
type: Feature
body:
  - type: dropdown
    id: area
    attributes:
      label: Which site or area is affected?
      options:
        - www.phpbb.com
        - area51.phpbb.com
        - blog.phpbb.com
        - tracker.phpbb.com (the tracker itself, not phpBB bugs)
        - Downloads
        - Sign-in / account
        - Something else / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context or screenshots about the feature request.
